# Render blueprint for the Outly API (ARCHITECTURE §27).
#
# Values marked `sync: false` are entered in the Render dashboard on first
# deploy and never live in this repository. The JWT secrets are generated by
# Render — two independent random values, which satisfies env.js's rules that
# they be long and different from each other.

services:
  - type: web
    name: outly-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.6
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # Cross-site refresh cookie: Vercel frontend, Render API.
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none

      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
